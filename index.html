<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FF385C" />
    <!-- 홈 화면 웹앱(iOS): 상태바 아래까지 화면을 쓰고 각 화면 상단이 env(safe-area-inset-top) 만큼 자기 배경으로 채운다 (2026-09-04) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // 카카오톡 인앱 브라우저 탈출 — OS 기본 브라우저(iOS 사파리 / Android 크롬 등)로 다시 연다.
      // 인앱 웹뷰는 구글 등 소셜 로그인이 막히는(disallowed_useragent) 문제가 있어 바깥으로 뺀다.
      // 번들 로드 전에 실행해 웹뷰 깜빡임을 없애고, Safari/Chrome UA 는 KAKAOTALK 을 안 포함하므로 루프가 없다.
      (function () {
        if (/KAKAOTALK/i.test(navigator.userAgent || '')) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href)
        }
      })()
    </script>
    <title>풀잇 · 매일 3문제로 약점 찾기</title>
    <!-- 네이버 서치어드바이저 사이트 소유 확인 (2026-09-07) -->
    <meta name="naver-site-verification" content="36d02d81018189e15be6f75cb3d26d7106f45b9a" />
    <meta
      name="description"
      content="풀잇은 매일 3문제로 수능 수학·영어 약점을 찾아주는 데일리 학습 서비스입니다. 하루 5분, 문제를 풀면 취약 단원을 분석해 드립니다."
    />
    <!-- 정본은 www — apex(pullit.co.kr) 는 301 로 www 에 넘긴다. 리다이렉트되는 주소를
         canonical 로 주면 구글이 어느 쪽을 색인할지 흔들려 검색 결과에서 빠질 수 있다 (2026-09-08) -->
    <link rel="canonical" href="https://www.pullit.co.kr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="풀잇" />
    <meta property="og:title" content="풀잇 · 매일 3문제로 약점 찾기" />
    <meta
      property="og:description"
      content="매일 3문제로 수능 수학·영어 약점을 찾아주는 데일리 학습 서비스"
    />
    <meta property="og:url" content="https://www.pullit.co.kr/" />
    <!-- 링크 공유 썸네일 — 모든 페이지 공통(SPA 라 index.html 하나가 전 경로에 서빙된다).
         카카오 "초대하기" 는 여기를 안 쓴다 — Kakao.Share.sendDefault 로 og-invite.png 를 직접 넘김.
         서빙 도메인(www) 절대경로 필수: apex(pullit.co.kr) 는 301 이라 스크래퍼가 놓칠 수 있다. -->
    <meta property="og:image" content="https://www.pullit.co.kr/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="쉬는 시간에, 지하철에서 15분 — 하루 약점 3문제 풀면 끝" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.pullit.co.kr/og-default.png" />
    <link rel="icon" type="image/png" href="/logo_pullit_favicon.png" />
    <link rel="apple-touch-icon" href="/logo_pullit_favicon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Paperlogy-7Bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/KoPubWorldBatang-Bold.woff2" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
      crossorigin="anonymous"
    />
    <!-- Meta Pixel — init 만 여기서. PageView 는 SPA 라우트 이동마다 React 쪽
         (services/metaPixel.ts)이 쏜다 — 여기서도 쏘면 첫 페이지가 이중 집계된다.
         로컬 개발(localhost·사설 IP)에서는 로드하지 않아 카운트를 오염시키지 않는다. -->
    <script>
      (function () {
        if (/^(localhost|127\.|10\.|172\.(1[6-9]|2\d|3[01])\.|192\.168\.)/.test(location.hostname)) return
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '3838902539584016');
      })()
    </script>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=3838902539584016&ev=PageView&noscript=1"
    /></noscript>
    <script>
      // 다크 랜딩('/') 흰 화면 플래시 방지 — JS 번들 로드 전에 배경을 먼저 검게
      if (location.pathname === '/') document.documentElement.style.background = '#000'
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
