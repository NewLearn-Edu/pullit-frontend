name: deploy-prod

on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC 토큰 발급용
  contents: read

env:
  S3_BUCKET: pullit-frontend-prod
  CLOUDFRONT_DISTRIBUTION_ID: E1BP3DRYW5QLID

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # VITE_* 는 빌드 타임에 번들에 박힘 — 미주입 시 코드 기본값(api-dev)으로 빌드되므로 필수
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.pullit.co.kr

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::860051323093:role/pullit-github-actions
          aws-region: ap-northeast-2

      # 캐시 전략 3단계:
      #  1) 해시 파일(assets/*, workbox-*.js): 내용 바뀌면 파일명이 바뀌므로 1년 불변 캐시
      #  2) public/ 정적 파일(fonts, favicon): 해시 없으므로 1일 캐시
      #  3) 진입점(index.html, sw.js 등): 구버전이 캐시되면 배포가 무효화되므로 no-cache
      # --delete 미사용: 배포 전 열어둔 페이지가 구버전 청크를 lazy-load할 때 404 방지
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" --exclude "sw.js" --exclude "registerSW.js" \
            --exclude "manifest.webmanifest" --exclude "fonts/*" \
            --exclude "logo_pullit_favicon.png"

          aws s3 sync dist/fonts "s3://$S3_BUCKET/fonts" \
            --cache-control "public,max-age=86400"
          aws s3 cp dist/logo_pullit_favicon.png "s3://$S3_BUCKET/logo_pullit_favicon.png" \
            --cache-control "public,max-age=86400"

          for f in index.html sw.js registerSW.js manifest.webmanifest; do
            aws s3 cp "dist/$f" "s3://$S3_BUCKET/$f" --cache-control "no-cache"
          done

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
