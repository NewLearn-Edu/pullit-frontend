name: deploy-dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write   # OIDC 토큰 발급용
  contents: read

env:
  ECR_REGISTRY: 860051323093.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: pullit/front-dev
  EC2_INSTANCE_ID: i-015747fe42316cb05

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::860051323093:role/pullit-github-actions
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # EC2가 t4g(ARM)이라 arm64로 크로스빌드
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # push된 latest를 EC2가 pull & 재기동 (SSM Run Command — SSH/키 불필요)
      - name: Deploy to EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.repository }} ${{ github.sha }}" \
            --parameters 'commands=["cd /home/ubuntu/pullit && docker compose --env-file .env.dev pull --quiet && docker compose --env-file .env.dev up -d && docker image prune -f"]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" || true
          RESULT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID")
          echo "$RESULT" | python3 -c "import sys,json; r=json.load(sys.stdin); print('status:', r['Status']); print(r['StandardOutputContent']); print(r['StandardErrorContent'], file=sys.stderr); sys.exit(0 if r['Status']=='Success' else 1)"
